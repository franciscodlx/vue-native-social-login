packages:
  - 'packages/*'
  - 'examples/*'
  - 'tools/*'

# Install scripts we do not need (prebuilt binaries).
allowBuilds:
  esbuild: false

# vue-native's runtime is built against one exact Vue release (its "Vue cohort").
overrides:
  'vue': 3.5.40
  '@vue/compiler-core': 3.5.40
  '@vue/compiler-dom': 3.5.40
  '@vue/compiler-sfc': 3.5.40
  '@vue/compiler-ssr': 3.5.40
  '@vue/reactivity': 3.5.40
  '@vue/runtime-core': 3.5.40
  '@vue/runtime-dom': 3.5.40
  '@vue/server-renderer': 3.5.40
  '@vue/shared': 3.5.40
